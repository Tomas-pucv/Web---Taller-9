$kind: http-request
description: Paso 4. Reemplaza el token guardado por el de carla.
url: "{{baseUrl}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "carla",
      "password": "carla-12345"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // Guarda el token en la variable {{token}} de la colección.
      if (pm.response.code === 200) {
        pm.collectionVariables.set("token", pm.response.json().token);
      }
    language: text/javascript
order: 14000
